<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customizable glass folder</title><style>@font-face{font-family:Inter;src:url(assets/Inter-Regular.woff2);font-weight:400}@font-face{font-family:Inter;src:url(assets/Inter-Medium.woff2);font-weight:500}*{box-sizing:border-box}body{margin:0;background:#e5e5e5;display:grid;place-items:center;min-height:100svh}main{position:relative;width:min(100vw,100svh);aspect-ratio:1}#stage,svg{display:block;width:100%;height:100%}button{position:absolute;padding:0;border:0;background:transparent;color:transparent;cursor:pointer}button:focus-visible{outline:2px solid #4087cc;outline-offset:3px;border-radius:5px}#draw{touch-action:none;cursor:crosshair}#rename{cursor:text}#name{position:absolute;background:#64a6eb;color:white;border:1px solid #ffffff70;outline:none;text-align:center;font-family:Inter,sans-serif;font-weight:500;padding:0;border-radius:2px}#name[hidden]{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}</style><main id="frame" aria-label="Customizable glass folder"><div id="stage" aria-hidden="true"></div><button id="create" aria-label="New folder"></button><button id="draw" aria-label="Draw on folder" hidden></button><button id="rename" aria-label="Rename folder" hidden></button><button id="color0" aria-label="Orange folder" hidden></button><button id="color1" aria-label="Green folder" hidden></button><button id="color2" aria-label="Blue folder" hidden></button><button id="color3" aria-label="Magenta folder" hidden></button><input id="name" aria-label="Folder name" maxlength="30" hidden><p id="status" class="sr" aria-live="polite"></p></main><script src="native-data.js"></script><script src="scene.js"></script><script src="app.js"></script></html>
