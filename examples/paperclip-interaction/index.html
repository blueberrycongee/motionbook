<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share transcript</title><style>*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;place-items:center;background:#f9f9f9;overflow:hidden}.scene{position:relative;width:min(100vw,110vh);aspect-ratio:1080/982}.scene svg{display:block;width:100%;height:100%}button{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:20px}button:focus-visible{outline:2px solid #62a9e7;outline-offset:4px}#share{left:64.6%;top:1%;width:12%;height:6%}#clip{left:34.7%;top:20%;width:4%;height:8%}#close{left:68.8%;top:11.8%;width:4%;height:4%}</style></head><body><main class="scene"><div id="stage" aria-hidden="true"></div><button id="share" aria-label="Share transcript" aria-expanded="false"></button><button id="clip" aria-label="Collapse stacked transcript sheets"></button><button id="close" aria-label="Close share transcript"></button></main><script src="ink-data.js"></script><script src="scene.js"></script><script src="app.js"></script></body></html>
