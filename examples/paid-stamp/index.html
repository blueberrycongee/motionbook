<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paid stamp</title><link rel="stylesheet" href="style.css"></head><body><main class="stage" aria-label="Invoice payment-date stamp demonstration"><div id="art" aria-hidden="true"></div><div id="editor" class="controls"><button class="wheel day" data-field="day" aria-label="Payment day. Use arrow keys or drag vertically."></button><button class="wheel month" data-field="month" aria-label="Payment month. Use arrow keys or drag vertically."></button><button class="wheel year" data-field="year" aria-label="Payment year. Use arrow keys or drag vertically."></button><div id="statuses" role="group" aria-label="Stamp status"></div><div id="colors" role="group" aria-label="Stamp color"></div><button id="mark" aria-label="Mark invoice as paid"></button></div><div id="confirmation" class="controls"><button id="undo">Undo</button><button id="done">Done</button></div><div id="finished" class="controls"><button id="download">Download PDF</button><button id="next">Next invoice</button></div><p id="announcement" class="sr-only" role="status" aria-live="polite"></p><button id="replay" class="replay" aria-label="Replay demonstration">↻</button></main><script type="module" src="src/main.mjs"></script></body></html>
