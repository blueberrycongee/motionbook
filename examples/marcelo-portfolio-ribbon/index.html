<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curved Portfolio Ribbon</title><style>@font-face{font-family:StudySans;src:url(assets/StudySans.ttf)}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e9e9}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #2736f1;outline-offset:-3px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}button{position:fixed;right:0.8%;top:3.5%;width:2.8%;height:4.5%;opacity:0;cursor:pointer}button:focus-visible{opacity:1;border:2px solid #2736f1;background:#e9e9e9}</style></head><body><canvas id="ribbon" tabindex="0" aria-label="Portfolio gallery. Drag or scroll to browse ten original artworks. Arrow keys move, Space pauses or resumes the demonstration, Escape restarts it."></canvas><p class="sr" id="status" aria-live="polite">Loading gallery</p><button id="fullscreen" aria-label="Toggle full screen">⛶</button><script type="module" src="src/app.mjs"></script></body></html>
