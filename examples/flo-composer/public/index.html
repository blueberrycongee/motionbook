<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flo composer</title>
<style>
@font-face{font-family:Inter;src:url('./assets/Inter-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#faf8f6;color:#77736f;font:14px Inter,Arial,sans-serif;display:grid;min-height:100vh;place-items:center}.study{width:min(100vw,620px);position:relative}#scene{width:100%;line-height:0}#scene svg{display:block;width:100%;height:auto}.hit{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:12px}.hit:focus-visible{outline:2px solid #92adbf;outline-offset:3px}#connect{left:26.8%;top:60.4%;width:38%;height:6.5%}#approval{left:33.4%;top:49.6%;width:42%;height:6%}.controls{position:fixed;z-index:4;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #e5e1dd;border-radius:30px;background:#fffdfbf0;white-space:nowrap;box-shadow:0 6px 22px #33251108}button.control{font:inherit;color:#7b7772;padding:7px 13px;background:transparent;border:0;border-radius:22px;cursor:pointer}button.control:hover,button.control[aria-pressed=true]{background:#eeece8;color:#383530}a{color:inherit;font-size:12px;margin:0 8px;text-decoration:none}.note{position:fixed;top:18px;left:20px;font-size:11px;letter-spacing:.05em;color:#aaa49d}#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:450px){.controls{font-size:11px;gap:1px}.note{font-size:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<main class="study"><div id="scene"></div><button id="connect" class="hit" aria-label="Connect apps"></button><button id="approval" class="hit" aria-label="Request approval"></button><div id="status" role="status" aria-live="polite"></div></main>
<script type="module">
import {Composer,spec,stateAt} from '../src/model.mjs';import {renderScene} from '../src/scene.mjs';
const scene=document.querySelector('#scene'),connect=document.querySelector('#connect'),approval=document.querySelector('#approval'),status=document.querySelector('#status');
const model=new Composer();let mode=matchMedia('(prefers-reduced-motion:reduce)').matches?'interactive':'replay',started=performance.now(),frame;
function show(s){scene.innerHTML=renderScene(s);connect.style.top=(60.4-25*s.connect)+'%';connect.disabled=s.connect>.99;connect.setAttribute('aria-label',s.connect>.99?'Project selected':'Connect apps');approval.style.top=(49.6+8.48*s.connect)+'%';approval.disabled=s.approval>.99;approval.setAttribute('aria-label',s.approval>.99?'Unrestricted access':'Request approval');}
function setMode(next){mode=next;started=performance.now();model.reset();status.textContent=mode==='interactive'?'Interactive study. Connect apps, then request approval.':'Replaying the observed animation.';}
function tick(now){let s;if(mode==='replay'){const t=(now-started)/1000;s=stateAt(Math.min(t,spec.duration));if(t>spec.duration+1)started=now;}else s=model.state(now);show(s);frame=requestAnimationFrame(tick);}
connect.onclick=()=>{if(mode!=='interactive')setMode('interactive');model.connect(performance.now());status.textContent='Connecting apps. App icons hop in sequence, then project selection appears.';};
approval.onclick=()=>{if(mode!=='interactive'){setMode('interactive');model.connect(performance.now()-3000);}model.approve(performance.now());status.textContent='Visual demo: unrestricted access badge. No real permissions are changed.';};
for(const [el,region]of [[connect,'apps'],[approval,'approval']]){el.onpointerenter=el.onfocus=()=>model.hover(region,true);el.onpointerleave=el.onblur=()=>model.hover(region,false);}
setMode(mode);requestAnimationFrame(tick);window.floStudy={stateAt,renderScene,model,replay:()=>setMode('replay'),interactive:()=>setMode('interactive')};
</script></body></html>
