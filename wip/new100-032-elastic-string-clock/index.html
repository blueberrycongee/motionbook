<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elastic string clock</title><style>*{box-sizing:border-box}html,body{margin:0;background:#ebebeb}body{min-height:100vh;display:grid;place-items:center}.stage{position:relative;width:min(100vw,159.8148vh);aspect-ratio:1726/1080;touch-action:none}#scene,#scene svg{display:block;width:100%;height:100%}#scene{cursor:grab}#scene:active{cursor:grabbing}button{position:absolute;background:transparent;border:0;padding:0;border-radius:50%;cursor:pointer}button:focus-visible{outline:2px solid #777}#reset{right:2.3%;top:3.4%;width:4.4%;height:5.3%}.color{top:20%;width:3.25%;height:5.2%}</style></head><body><main class="stage"><div id="scene" role="application" aria-label="Elastic clock. Drag its center, string ends or strands. Press R to reset."></div><button id="reset" aria-label="Reset clock"></button><button class="color" style="left:2.38%" data-color="#ebebeb" aria-label="Gray background"></button><button class="color" style="left:6.23%" data-color="#c8c8c8" aria-label="Dark gray background"></button><button class="color" style="left:10.08%" data-color="#e6efd9" aria-label="Green background"></button><button class="color" style="left:13.93%" data-color="#f3f1c9" aria-label="Yellow background"></button><button class="color" style="left:17.78%" data-color="#dae6ee" aria-label="Blue background"></button></main><script src="scene.js"></script><script src="physics.js"></script><script src="app.js"></script></body></html>
