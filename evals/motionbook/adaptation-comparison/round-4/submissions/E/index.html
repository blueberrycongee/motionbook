<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Field notes · Reading room</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:#293d36;background:#f3f4f2;font-family:Arial,Helvetica,sans-serif}body{min-height:100svh}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,article:focus-visible{outline:2px solid #507562;outline-offset:4px}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #e1e5df;color:#66736c;font-size:12px;letter-spacing:.015em}.brand{display:flex;align-items:center;gap:10px;color:#35463d}.brand svg{width:20px;height:20px}.mode{display:flex;align-items:center;gap:7px}.dot{width:5px;height:5px;border-radius:50%;background:#7b9688}.workspace{padding:48px 24px 290px}.document{width:min(100%,600px);min-height:365px;margin:0 auto;padding:48px 50px 30px;background:#fff;border:1px solid #e0e4dd;box-shadow:0 4px 14px #263b2b03;display:flex;flex-direction:column;position:relative}.eyebrow{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#72877a;margin:0 0 27px}h1{font-family:Georgia,'Times New Roman',serif;font-size:39px;line-height:1.1;letter-spacing:-1px;font-weight:400;margin:0 0 21px}.body-copy{font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.7;color:#58685e;margin:0}.page-foot{margin-top:auto;padding-top:70px;display:flex;justify-content:space-between;align-items:center;color:#89948c;font-size:10px;letter-spacing:.05em}.page-foot:before{content:'';width:32px;height:1px;background:#ced8cf}.dock{position:fixed;width:min(590px,calc(100% - 40px));left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2}.composer{background:#ffffff;border:1px solid #dce3dd;border-radius:24px;box-shadow:0 12px 42px #223d2e0d,0 2px 5px #203c2c04;overflow:hidden;transition:box-shadow 220ms ease,border-color 220ms ease}.composer:focus-within{border-color:#aabdb0;box-shadow:0 12px 42px #223d2e14,0 0 0 3px #819e8914}.composer-head{height:0;opacity:0;overflow:hidden;transition:height 240ms cubic-bezier(.2,.8,.2,1),opacity 160ms ease;display:flex;align-items:center;justify-content:space-between;margin:0 18px;border-bottom:0 solid #edf0eb;white-space:nowrap}.context{display:flex;align-items:center;gap:8px;color:#5e7265;font-size:12px}.local{font-size:10px;color:#78857b;letter-spacing:.04em}.editor-row{display:flex;align-items:flex-end;padding:16px;gap:8px}.editor-wrap{flex:1;min-width:0;display:flex;align-items:center;align-self:stretch;padding:5px 0 5px 4px}textarea{display:block;width:100%;height:24px;line-height:24px;border:0;resize:none;outline:none;background:transparent;color:#314138;padding:0;font-size:14px;transition:height 240ms cubic-bezier(.2,.8,.2,1);scrollbar-width:thin}textarea::placeholder{color:#87928b}textarea:focus-visible{border-radius:3px;outline:2px solid #789584;outline-offset:3px}.icon-button{display:grid;place-items:center;width:34px;height:34px;border:0;background:transparent;border-radius:50%;color:#6f7e73;flex:none;transition:background 160ms ease,transform 160ms ease}.icon-button:hover{background:#eef2ed}.send{background:#30483b;color:#fff}.send:hover{background:#1e3629}.send[aria-disabled="true"]{background:#e9ede7;color:#9ca79d;cursor:default}.send:not([aria-disabled="true"]):active{transform:scale(.93)}.footer{height:0;opacity:0;overflow:hidden;padding:0 20px;color:#859087;font-size:10px;transition:height 240ms cubic-bezier(.2,.8,.2,1),opacity 160ms ease}.footer span{float:right}.composer[data-expanded="true"] .composer-head{height:45px;opacity:1;border-bottom-width:1px}.composer[data-expanded="true"] textarea{height:84px}.composer[data-expanded="true"] .footer{height:29px;opacity:1}.composer[data-expanded="true"] .expand-icon{transform:rotate(180deg)}.expand-icon{transition:transform 240ms ease}.below{text-align:center;margin:12px 0 0;font-size:10px;color:#89948b;letter-spacing:.02em}.conversation{max-height:min(220px,32svh);overflow:auto;overscroll-behavior:contain;margin-bottom:12px;padding:18px;background:#fbfcfa;border:1px solid #dfe5dd;border-radius:20px;box-shadow:0 8px 24px #2d423309;scrollbar-width:thin}.conversation:empty{display:none}.message{margin:0 0 15px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.message:last-child{margin-bottom:0}.message-label{display:block;color:#7e8b80;font-size:10px;margin-bottom:5px;letter-spacing:.04em}.message p{white-space:pre-wrap;margin:0}.message.user p{display:inline-block;background:#edf1e9;padding:9px 12px;border-radius:12px 12px 3px 12px;max-width:100%;color:#354b3c}.message.user{text-align:right}.message.assistant p{color:#596b5e}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:520px){.topbar{height:60px;padding:0 20px}.mode{font-size:10px}.workspace{padding:34px 20px 300px}.document{padding:34px 28px 25px;min-height:340px}h1{font-size:35px}.body-copy{font-size:17px;max-width:240px}.eyebrow{margin-bottom:25px}.dock{width:calc(100% - 28px);bottom:max(18px,env(safe-area-inset-bottom))}.editor-row{padding:13px;gap:5px}.context{font-size:11px}.footer{padding:0 17px;font-size:9px}.below{font-size:9px}.conversation{padding:14px}.local{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H5zM14 7a3 3 0 0 1 3-3h3v15h-2a4 4 0 0 0-4 2"/></svg>Reading room</div><div class="mode"><span class="dot"></span>Local workspace</div></header>
<main class="workspace"><article class="document" tabindex="0" aria-label="Field notes document"><p class="eyebrow">A small collection · 01</p><h1>Field notes</h1><p class="body-copy">A quiet place to collect what matters.</p><div class="page-foot"><span>1 / 1</span></div></article></main>
<section class="dock" aria-label="Document assistant">
<div class="conversation" id="conversation" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions" tabindex="0"></div>
<form class="composer" id="composer" data-expanded="false">
<div class="composer-head" aria-hidden="true"><span class="context"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7zM14 3v5h4M10 12h5M10 16h5"/></svg>Discussing Field notes</span><span class="local">LOCAL DEMO</span></div>
<div class="editor-row"><div class="editor-wrap"><label class="sr-only" for="draft">Ask about Field notes</label><textarea id="draft" rows="1" placeholder="Ask about this document…" aria-describedby="keyboard-help"></textarea></div><button type="button" class="icon-button" id="expand" aria-label="Expand composer" aria-expanded="false" aria-controls="draft" title="Expand composer"><svg class="expand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg></button><button class="icon-button send" type="submit" id="send" aria-label="Send message" title="Send message" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18V6m-5 5 5-5 5 5"/></svg></button></div>
<div class="footer" id="keyboard-help">Enter to send · Shift + Enter for a new line<span>Esc to collapse</span></div>
</form><p class="below">A little room to think, beside your document.</p>
</section>
<script>
(()=>{
const form=document.getElementById('composer'),draft=document.getElementById('draft'),expand=document.getElementById('expand'),send=document.getElementById('send'),log=document.getElementById('conversation'),head=form.querySelector('.composer-head');
let expanded=false,composing=false;
function setExpanded(value){expanded=value;form.dataset.expanded=String(value);expand.setAttribute('aria-expanded',String(value));expand.setAttribute('aria-label',value?'Collapse composer':'Expand composer');expand.title=value?'Collapse composer':'Expand composer';head.setAttribute('aria-hidden',String(!value));}
function updateSend(){send.setAttribute('aria-disabled',String(!draft.value.trim()||composing));}
draft.addEventListener('focus',()=>setExpanded(true));
draft.addEventListener('input',()=>{setExpanded(true);updateSend();});
draft.addEventListener('compositionstart',()=>{composing=true;updateSend();});
draft.addEventListener('compositionend',()=>{composing=false;updateSend();});
expand.addEventListener('click',()=>{const next=!expanded;setExpanded(next);if(next)draft.focus({preventScroll:true});});
document.addEventListener('pointerdown',event=>{if(!event.target.closest('.dock')){setExpanded(false);if(document.activeElement===draft)draft.blur();}});
form.addEventListener('focusout',()=>{queueMicrotask(()=>{if(!form.contains(document.activeElement))setExpanded(false);});});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!event.isComposing&&!composing&&expanded){event.preventDefault();setExpanded(false);if(form.contains(document.activeElement))expand.focus({preventScroll:true});}});
function appendMessage(role,label,text){const item=document.createElement('div');item.className='message '+role;const author=document.createElement('span');author.className='message-label';author.textContent=label;const body=document.createElement('p');body.textContent=text;item.append(author,body);log.append(item);}
function submit(){const text=draft.value.trim();if(!text||composing)return;draft.value='';updateSend();appendMessage('user','You',text);appendMessage('assistant','Reading companion · Local simulated reply','This note is an invitation to keep what matters. Try adding one observation you would like to return to.');setExpanded(true);draft.focus({preventScroll:true});log.scrollTop=log.scrollHeight;}
form.addEventListener('submit',event=>{event.preventDefault();submit();});
draft.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){if(event.isComposing||composing||event.keyCode===229)return;event.preventDefault();if(!event.repeat)submit();}});
})();
</script>
</body>
</html>
