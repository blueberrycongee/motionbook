<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fieldnotes · Labels</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#262824;background:#f7f7f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button,input{ -webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #708a76;outline-offset:3px}button{color:inherit} [hidden]{display:none!important}
.workspace{width:min(620px,calc(100% - 48px));margin:88px auto 40px}.brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:650;letter-spacing:1.5px;text-transform:uppercase;color:#72766e}.brand svg{width:20px;height:20px}.note{margin-top:48px}.eyebrow{color:#8b8e86;font-size:11px;letter-spacing:1.8px;font-weight:600;text-transform:uppercase}.note h1{font-size:32px;line-height:1.2;letter-spacing:-1.3px;font-weight:550;margin:14px 0 12px}.description{color:#7b7e75;font-size:14px;line-height:1.7;margin:0;max-width:420px}.rule{height:1px;background:#e4e6df;margin:27px 0 22px}.component{position:relative;width:100%;max-width:100%}.labelbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:38px}.chips{display:contents}.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid #dddfd8;background:#fff;border-radius:24px;box-shadow:0 1px 2px #23282306;font-size:13px;line-height:18px;max-width:100%;animation:chip-in .18s ease-out}.chip .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--color)}.trigger{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:#eaece5;border-radius:22px;padding:9px 13px;font-size:13px;font-weight:550;line-height:18px;transition:background .12s}.trigger:hover,.trigger[aria-expanded=true]{background:#e1e5dc}.trigger svg{width:15px;height:15px}.hint{margin:14px 0 0;color:#979b90;font-size:12px;line-height:1.6}.popover{position:absolute;left:0;top:calc(100% + 12px);width:336px;max-width:100%;border:1px solid #d7dbd1;border-radius:17px;background:white;box-shadow:0 14px 32px -14px #28332230,0 3px 7px #28332209;overflow:hidden;z-index:2;transform-origin:top left;animation:open .19s cubic-bezier(.2,.8,.2,1)}.searchbox{display:flex;gap:9px;align-items:center;padding:15px 16px;border-bottom:1px solid #eceee7}.searchbox svg{width:16px;height:16px;flex:none;color:#8a8f82}.searchbox input{width:100%;min-width:0;border:0;background:transparent;padding:2px 0;font-size:14px;color:#262824;line-height:22px}.searchbox input::placeholder{color:#93988b}.searchbox input:focus-visible{outline-offset:5px;border-radius:2px}.rows{padding:7px;max-height:260px;overflow:auto}.option{position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:43px;padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer;transition:background .12s}.option:hover,.option:focus-within{background:#f3f5ef}.option input{appearance:none;width:17px;height:17px;border:1px solid #d6dacf;border-radius:5px;margin:0;flex:none;cursor:pointer;background:#fff}.option input:checked{background:#343d30;border-color:#343d30}.option input:checked:after{content:"";display:block;width:8px;height:4px;border-left:1.5px solid white;border-bottom:1.5px solid white;transform:translate(3px,4px) rotate(-45deg)}.option .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.create-option{border:0;background:transparent;text-align:left;gap:11px}.create-option svg{width:17px;height:17px;flex:none}.create-option .create-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{font-size:12px;color:#919788;margin:13px 10px}.picker-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eceee7;padding:12px 16px;font-size:11px;color:#8b9282}.key{border:1px solid #e3e6dc;border-radius:4px;padding:2px 4px;font-size:10px;color:#929989}.creation{background:#f1f3ed;padding:6px;animation:slide-in .18s cubic-bezier(.2,.8,.2,1)}.create-header{display:flex;align-items:center;gap:10px;padding:8px 6px 12px}.back{border:0;background:transparent;border-radius:7px;width:30px;height:30px;display:grid;place-items:center;color:#737c69}.back:hover{background:#e4e8df}.back svg{width:17px;height:17px}.create-heading{font-size:12px;color:#7d8575;flex:none}.preview{display:inline-flex;align-items:center;gap:7px;margin-left:auto;max-width:150px;border:1px solid #dde2d4;border-radius:20px;background:white;padding:6px 9px;font-size:12px;min-height:30px}.preview span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.create-body{padding:18px 16px 16px;background:#fff;border:1px solid #dce1d5;border-radius:12px}.field-label,legend{font-size:11px;font-weight:600;color:#7d8573}.name-input{display:block;width:100%;border:1px solid #d8ddcf;border-radius:8px;padding:11px 12px;margin-top:8px;font-size:14px;background:#fff}.name-input:focus{border-color:#8c9a7d}.colors{padding:0;border:0;margin:19px 0 0;min-width:0}.swatches{display:flex;justify-content:space-between;gap:6px;margin-top:11px}.swatch{position:relative;display:grid;place-items:center;width:35px;height:35px;cursor:pointer}.swatch input{appearance:none;position:absolute;inset:0;margin:0;width:100%;height:100%;border:1px solid transparent;border-radius:50%;background:transparent;cursor:pointer}.swatch input:checked{border-color:var(--color)}.swatch .dot{width:23px;height:23px;pointer-events:none}.swatch input:checked~.dot:after{content:"";display:block;width:8px;height:4px;border-left:1.5px solid white;border-bottom:1.5px solid white;transform:translate(7px,8px) rotate(-45deg)}.color-caption{font-size:11px;color:#919886;margin:10px 0 0;min-height:16px}.actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #edf0e7;margin-top:17px;padding-top:14px}.cancel,.commit{border-radius:8px;font-size:12px;padding:9px 14px;border:1px solid #e1e5d9;background:#fff}.cancel:hover{background:#f4f6ef}.commit{background:#384431;border-color:#384431;color:white}.commit:hover{background:#263221}.commit:disabled{background:#dfe3d8;color:#919b86;border-color:#dfe3d8;cursor:default}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.page-foot{font-size:10px;color:#a3a89a;letter-spacing:.3px;margin-top:330px;display:flex;align-items:center;gap:7px}.page-foot .dot{width:5px;height:5px;background:#8d9d81}@keyframes open{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}@keyframes slide-in{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}@keyframes chip-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}@media(max-width:500px){.workspace{width:calc(100% - 40px);margin-top:48px}.note{margin-top:39px}.note h1{font-size:29px}.description{max-width:290px}.popover{width:100%}.page-foot{margin-top:340px}}@media(prefers-reduced-motion:reduce){.component *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="workspace">
<div class="brand"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.5"/><path d="M8 3v18M11 8h5M11 12h5" stroke="currentColor" stroke-width="1.5"/></svg>Fieldnotes</div>
<section class="note" aria-labelledby="note-title"><div class="eyebrow">A little more organized</div><h1 id="note-title">Ideas, with a place to belong.</h1><p class="description">A few thoughtful labels make the next good idea<br class="desktop-break"> easier to find.</p><div class="rule"></div>
<div class="component" id="component">
<div class="labelbar"><div class="chips" id="chips"></div><button class="trigger" id="trigger" aria-expanded="false" aria-controls="popover" aria-haspopup="dialog"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Labels</button></div>
<div class="popover" id="popover" role="dialog" aria-label="Choose labels" hidden>
<div id="picker"><div class="searchbox"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input id="search" type="text" maxlength="40" placeholder="Find or create a label…" aria-label="Search labels" autocomplete="off" spellcheck="false"></div><div class="rows" id="rows" role="group" aria-label="Available labels"></div><div class="picker-foot"><span id="count">0 labels selected</span><span><span class="key">esc</span> to close</span></div></div>
<form id="creation" class="creation" hidden><div class="create-header"><button type="button" class="back" id="back" aria-label="Back"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m11 5-5 5 5 5M6 10h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="create-heading">Create label</span><span class="preview"><span class="dot" id="preview-dot"></span><span id="preview-name"></span></span></div><div class="create-body"><label class="field-label" for="name">Label name</label><input class="name-input" id="name" maxlength="40" autocomplete="off" required><fieldset class="colors"><legend>Color</legend><div class="swatches" id="swatches"></div><p class="color-caption" id="color-caption"></p></fieldset><div class="actions"><button class="cancel" id="cancel" type="button">Back</button><button class="commit" id="commit" type="submit">Create</button></div></div></form>
</div>
</div>
<p class="hint">Make it yours. Choose a label or create a new one.</p>
</section>
<div class="page-foot"><span class="dot"></span>A small space for everything you're thinking.</div>
<p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const component=$('component'),trigger=$('trigger'),popover=$('popover'),picker=$('picker'),creation=$('creation'),search=$('search'),rows=$('rows'),name=$('name');
const palette=[['Coral','#cb7567'],['Amber','#b38a42'],['Sage','#7d9769'],['Azure','#638ca5'],['Lilac','#9780b4'],['Rose','#b97192'],['Teal','#548e84']];
const labels=[{id:1,name:'Design',color:'#9780b4'},{id:2,name:'Research',color:'#548e84'},{id:3,name:'Personal',color:'#b38a42'}];
const selected=new Set();let mode='closed',color=2,nextId=4;
const normalize=s=>s.trim().toLocaleLowerCase();
function dot(value){const el=document.createElement('span');el.className='dot';el.style.setProperty('--color',value);el.setAttribute('aria-hidden','true');return el}
function announce(text){$('announcement').textContent=text}
function renderChips(){const fragment=document.createDocumentFragment();labels.filter(l=>selected.has(l.id)).forEach(l=>{const chip=document.createElement('span');chip.className='chip';chip.append(dot(l.color));const text=document.createElement('span');text.className='name';text.textContent=l.name;chip.append(text);fragment.append(chip)});$('chips').replaceChildren(fragment);$('count').textContent=selected.size+' label'+(selected.size===1?'':'s')+' selected'}
function toggle(label,checked){checked?selected.add(label.id):selected.delete(label.id);renderChips();announce(label.name+(checked?' selected':' removed'))}
function renderRows(){const q=normalize(search.value),fragment=document.createDocumentFragment();labels.filter(l=>normalize(l.name).includes(q)).forEach(l=>{const row=document.createElement('label');row.className='option';const input=document.createElement('input');input.type='checkbox';input.checked=selected.has(l.id);input.addEventListener('change',()=>toggle(l,input.checked));const text=document.createElement('span');text.className='name';text.textContent=l.name;row.append(input,dot(l.color),text);fragment.append(row)});if(q&&!labels.some(l=>normalize(l.name)===q)){const button=document.createElement('button');button.type='button';button.className='option create-option';button.innerHTML='<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';const text=document.createElement('span');text.className='create-text';text.textContent='Create “'+search.value.trim()+'”';button.append(text);button.addEventListener('click',beginCreate);fragment.append(button)}rows.replaceChildren(fragment)}
function open(){mode='picker';creation.hidden=true;picker.hidden=false;search.value='';renderRows();popover.hidden=false;popover.setAttribute('aria-label','Choose labels');trigger.setAttribute('aria-expanded','true');search.focus({preventScroll:true})}
function close(){if(mode==='closed')return;const focused=popover.contains(document.activeElement);mode='closed';if(focused)trigger.focus({preventScroll:true});popover.hidden=true;creation.hidden=true;picker.hidden=false;trigger.setAttribute('aria-expanded','false')}
function draft(){const value=name.value.trim();$('preview-name').textContent=value||'Label';$('preview-dot').style.setProperty('--color',palette[color][1]);$('color-caption').textContent=palette[color][0];$('commit').disabled=!value}
function beginCreate(){if(mode!=='picker'||!normalize(search.value))return;mode='create';name.value=search.value.trim();color=2;Array.from($('swatches').querySelectorAll('input')).forEach((r,i)=>r.checked=i===color);draft();creation.hidden=false;popover.setAttribute('aria-label','Create label');name.focus({preventScroll:true});name.select();picker.hidden=true}
function back(){if(mode!=='create')return;mode='picker';picker.hidden=false;renderRows();search.focus({preventScroll:true});creation.hidden=true;popover.setAttribute('aria-label','Choose labels')}
palette.forEach(([label,value],index)=>{const wrapper=document.createElement('label');wrapper.className='swatch';wrapper.style.setProperty('--color',value);wrapper.title=label;const input=document.createElement('input');input.type='radio';input.name='color';input.value=label;input.setAttribute('aria-label',label);input.checked=index===color;input.addEventListener('change',()=>{color=index;draft()});wrapper.append(input,dot(value));$('swatches').append(wrapper)});
trigger.addEventListener('click',()=>mode==='closed'?open():close());search.addEventListener('input',renderRows);name.addEventListener('input',draft);$('back').addEventListener('click',back);$('cancel').addEventListener('click',back);
creation.addEventListener('submit',event=>{event.preventDefault();if(mode!=='create'||!name.value.trim())return;const value=name.value.trim();let label=labels.find(l=>normalize(l.name)===normalize(value));if(!label){label={id:nextId++,name:value,color:palette[color][1]};labels.push(label)}selected.add(label.id);mode='picker';renderChips();search.value='';renderRows();picker.hidden=false;search.focus({preventScroll:true});creation.hidden=true;popover.setAttribute('aria-label','Choose labels');announce(label.name+' selected')});
component.addEventListener('keydown',event=>{if(mode==='closed')return;if(event.key==='Escape'){event.preventDefault();event.stopPropagation();mode==='create'?back():close();return}if(mode==='picker'&&event.target===search&&event.key==='Enter'){event.preventDefault();rows.querySelector('input,button')?.click()}if(mode==='picker'&&(event.key==='ArrowDown'||event.key==='ArrowUp')){const controls=[search,...rows.querySelectorAll('input,button')],index=controls.indexOf(event.target);if(index>=0){event.preventDefault();controls[(index+(event.key==='ArrowDown'?1:-1)+controls.length)%controls.length].focus()}}});
document.addEventListener('pointerdown',event=>{if(mode!=='closed'&&!component.contains(event.target))close()});
component.addEventListener('focusout',()=>queueMicrotask(()=>{if(mode!=='closed'&&!component.contains(document.activeElement))close()}));renderChips();
})();
</script>
</body></html>
