<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labels</title>
<style>
*{box-sizing:border-box}html{background:#fafafa}body{margin:0;color:#252525;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button,input{-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:2px solid #5179b4;outline-offset:3px}button{color:inherit}button:disabled{cursor:default;opacity:.4}[hidden]{display:none!important}.workspace{width:min(352px,calc(100% - 40px));margin:190px auto 0}.caption{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#898989;margin:0 0 19px 3px}.labels-component{position:relative}.selection{display:flex;align-items:center;flex-wrap:wrap;gap:7px;min-height:36px;max-height:80px;overflow:auto;padding:3px}.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #e3e3e3;background:#fff;border-radius:100px;padding:7px 11px;font-size:13px;font-weight:500;box-shadow:0 1px 2px #00000007;min-width:0;max-width:180px;animation:chip-in 150ms ease-out}.chip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--color)}.trigger{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:100px;background:#eeeeed;padding:9px 13px;font-size:13px;font-weight:550;min-height:36px;transition:background 130ms}.trigger:hover,.trigger[aria-expanded=true]{background:#e7e7e6}.plus{font-size:18px;line-height:13px;font-weight:400}.panel{position:absolute;z-index:2;left:0;right:0;top:calc(100% + 10px);border:1px solid #dedede;border-radius:17px;background:white;box-shadow:0 3px 5px #00000005,0 12px 28px -12px #00000024;overflow:auto;max-height:calc(100dvh - 295px);animation:panel-in 170ms cubic-bezier(.2,.7,.2,1);transform-origin:50% 0}.search-wrap{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid #f0f0f0;color:#999}.search-wrap svg{flex:0 0 16px}.search-wrap input{border:0;background:none;width:100%;min-width:0;padding:2px 0;font-size:14px;color:#252525}.search-wrap input::placeholder{color:#949494}.search-wrap input:focus-visible{outline-offset:6px;border-radius:2px}.rows{padding:7px}.row{display:flex;align-items:center;gap:11px;width:100%;border:0;background:white;text-align:left;min-height:42px;padding:8px 12px;border-radius:8px;font-size:14px}.row:hover,.row:focus-visible{background:#f3f3f2}.row .label-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.check{width:17px;height:17px;flex:0 0 17px;border:1px solid #dedede;border-radius:5px;display:grid;place-items:center;color:transparent;font-size:12px;line-height:1}.row[aria-pressed=true] .check{border-color:#282828;background:#282828;color:white}.row:not(:hover):not(:focus-visible)[aria-pressed=false] .check{border-color:transparent}.create-row{gap:12px}.create-row .plus{width:17px;text-align:center;flex-shrink:0}.create-row .create-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.create-row .query-word{color:#797979}.empty{font-size:12px;color:#8b8b8b;padding:12px 13px 9px;margin:0}.picker-foot{border-top:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;padding:10px 17px;font-size:11px;color:#919191}.key{font-size:10px;border:1px solid #e5e5e5;border-radius:4px;padding:1px 4px;color:#858585}.creation{background:#f3f3f2;padding:5px}.creation-header{display:flex;align-items:center;gap:9px;padding:7px 9px 12px;min-height:45px}.back{display:flex;align-items:center;gap:5px;border:0;background:none;font-size:12px;color:#777;padding:6px 4px;border-radius:5px}.back:hover{background:#e7e7e6}.creation-header .chip{margin-left:auto;padding:6px 10px;font-size:12px;max-width:190px;animation:none}.inner{background:white;border:1px solid #dedede;border-radius:12px;padding:15px 13px 12px;box-shadow:0 1px 2px #00000003}.field-title{font-size:11px;font-weight:550;color:#797979;display:block;margin:0 0 7px 2px}.name-input{border:1px solid #dfdfdf;border-radius:7px;width:100%;height:36px;padding:0 10px;font-size:14px;background:#fff}.colors{border:0;padding:0;margin:17px 0 9px}.colors legend{font-size:11px;color:#797979;font-weight:550;margin:0 0 5px 2px;padding:0}.color-option{position:relative;display:flex;align-items:center;gap:10px;min-height:31px;padding:5px 8px;font-size:13px;border-radius:6px;cursor:pointer}.color-option:hover{background:#f5f5f4}.color-option:has(input:checked){background:#f0f0ef}.color-option input{position:absolute;opacity:0;width:1px;height:1px}.color-option:has(input:focus-visible){outline:2px solid #5179b4;outline-offset:1px}.color-option .tick{margin-left:auto;visibility:hidden;font-size:12px}.color-option:has(input:checked) .tick{visibility:visible}.form-note{font-size:11px;color:#828282;line-height:1.4;min-height:16px;margin:9px 0}.actions{display:flex;justify-content:flex-end;border-top:1px solid #efefef;padding-top:10px}.submit{border:1px solid #252525;background:#292929;border-radius:7px;color:white;padding:8px 15px;font-size:12px;font-weight:500;box-shadow:0 1px 2px #00000010}.submit:hover:not(:disabled){background:#444}.quiet-note{margin:17px 3px;font-size:12px;color:#a1a1a1}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@keyframes panel-in{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}@keyframes chip-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}@media(max-width:500px){.workspace{margin-top:158px}.panel{max-height:calc(100dvh - 265px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="workspace">
<p class="caption">A place for everything</p>
<section class="labels-component" aria-label="Manage labels" id="component">
<div class="selection" id="selection"><span id="chips" style="display:contents"></span><button class="trigger" id="trigger" aria-expanded="false" aria-controls="panel" aria-haspopup="dialog"><span class="plus" aria-hidden="true">+</span>Labels</button></div>
<div class="panel" id="panel" role="dialog" aria-label="Labels" hidden>
<div id="picker">
<div class="search-wrap"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><input id="search" type="text" aria-label="Search labels" placeholder="Add or find a label…" maxlength="40" autocomplete="off" spellcheck="false"></div>
<div class="rows" id="rows" aria-label="Available labels"></div>
<div class="picker-foot"><span id="selection-count">2 selected</span><span><span class="key">esc</span> to close</span></div>
</div>
<form class="creation" id="creation" hidden>
<div class="creation-header"><button type="button" class="back" id="back"><span aria-hidden="true">←</span> Back</button><span class="chip"><i class="dot" id="preview-dot"></i><span id="preview-name"></span></span></div>
<div class="inner"><label class="field-title" for="name">Label name</label><input id="name" class="name-input" type="text" maxlength="40" autocomplete="off" required>
<fieldset class="colors" id="colors"><legend>Pick a color</legend></fieldset>
<p class="form-note" id="form-note">Your new label will be selected.</p>
<div class="actions"><button class="submit" id="submit" type="submit">Create label</button></div></div>
</form>
</div>
</section>
<p class="quiet-note">Small labels. A clearer space.</p>
<div class="sr-only" role="status" aria-live="polite" id="status"></div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const colors=[['Coral','#ed526b'],['Amber','#dc991d'],['Mint','#25ad7e'],['Azure','#3983e4'],['Lilac','#9863d4'],['Rose','#d84698'],['Teal','#219f9c']];
const labels=[{id:1,name:'Design',color:'#9863d4'},{id:2,name:'Research',color:'#219f9c'},{id:3,name:'Personal',color:'#dc991d'}];
const selected=new Set([1,2]);let opened=false,mode='picker',color=4,nextId=4;
const normalize=s=>s.trim().toLocaleLowerCase();
const announce=s=>{$('status').textContent=s};
function makeDot(value){const e=document.createElement('i');e.className='dot';e.style.setProperty('--color',value);e.setAttribute('aria-hidden','true');return e}
function updateChips(){
 $('chips').replaceChildren();
 labels.filter(l=>selected.has(l.id)).forEach(l=>{const chip=document.createElement('span');chip.className='chip';chip.title=l.name;chip.append(makeDot(l.color));const t=document.createElement('span');t.textContent=l.name;chip.append(t);$('chips').append(chip)});
 $('selection-count').textContent=selected.size+' selected';
}
function filtered(){return labels.filter(l=>normalize(l.name).includes(normalize($('search').value)))}
function renderRows(){
 const rows=$('rows');rows.replaceChildren();const matches=filtered(),q=$('search').value.trim();
 for(const l of matches){const b=document.createElement('button');b.type='button';b.className='row';b.setAttribute('aria-pressed',String(selected.has(l.id)));b.setAttribute('aria-label',l.name);const check=document.createElement('span');check.className='check';check.textContent='✓';check.setAttribute('aria-hidden','true');const name=document.createElement('span');name.className='label-name';name.textContent=l.name;b.append(check,makeDot(l.color),name);b.addEventListener('click',()=>{selected.has(l.id)?selected.delete(l.id):selected.add(l.id);b.setAttribute('aria-pressed',String(selected.has(l.id)));updateChips();announce(l.name+(selected.has(l.id)?' selected':' removed'))});rows.append(b)}
 if(q&&!labels.some(l=>normalize(l.name)===normalize(q))){if(!matches.length){const p=document.createElement('p');p.className='empty';p.textContent='No matching labels';rows.append(p)}const b=document.createElement('button');b.type='button';b.className='row create-row';b.setAttribute('aria-label','Create '+q);const plus=document.createElement('span');plus.className='plus';plus.textContent='+';plus.setAttribute('aria-hidden','true');const t=document.createElement('span');t.className='create-text';t.append('Create ');const v=document.createElement('span');v.className='query-word';v.textContent='“'+q+'”';t.append(v);b.append(plus,t);b.addEventListener('click',beginCreate);rows.append(b)}
}
function open(){opened=true;mode='picker';$('panel').hidden=false;$('picker').hidden=false;$('creation').hidden=true;$('trigger').setAttribute('aria-expanded','true');$('search').value='';renderRows();$('search').focus({preventScroll:true})}
function close(restore=true){if(!opened)return;opened=false;if(restore)$('trigger').focus({preventScroll:true});$('panel').hidden=true;$('trigger').setAttribute('aria-expanded','false');mode='picker'}
function refreshDraft(){const n=$('name').value.trim();$('preview-name').textContent=n||'New label';$('preview-dot').style.setProperty('--color',colors[color][1]);$('submit').disabled=!n;$('form-note').textContent=labels.some(l=>normalize(l.name)===normalize(n))?'This label exists. Create will select it.':'Your new label will be selected.'}
function beginCreate(){if(!opened||mode!=='picker')return;mode='create';$('name').value=$('search').value.trim();color=4;$('colors').querySelectorAll('input').forEach((r,i)=>r.checked=i===color);$('creation').hidden=false;refreshDraft();$('name').focus({preventScroll:true});$('name').select();$('picker').hidden=true}
function back(){if(mode!=='create')return;mode='picker';$('picker').hidden=false;renderRows();$('search').focus({preventScroll:true});$('creation').hidden=true}
colors.forEach(([name,value],i)=>{const l=document.createElement('label');l.className='color-option';const input=document.createElement('input');input.type='radio';input.name='color';input.value=name;input.checked=i===color;input.addEventListener('change',()=>{color=i;refreshDraft()});const t=document.createElement('span');t.textContent=name;const tick=document.createElement('span');tick.className='tick';tick.textContent='✓';tick.setAttribute('aria-hidden','true');l.append(input,makeDot(value),t,tick);$('colors').append(l)});
$('trigger').addEventListener('click',()=>opened?close():open());$('search').addEventListener('input',renderRows);$('name').addEventListener('input',refreshDraft);$('back').addEventListener('click',back);
$('creation').addEventListener('submit',e=>{e.preventDefault();if(!opened||mode!=='create')return;const name=$('name').value.trim();if(!name){$('name').focus();return}let label=labels.find(l=>normalize(l.name)===normalize(name));if(!label){label={id:nextId++,name,color:colors[color][1]};labels.push(label)}selected.add(label.id);updateChips();$('search').value='';back();announce(label.name+' created and selected')});
$('component').addEventListener('keydown',e=>{if(!opened)return;if(e.key==='Escape'){e.preventDefault();e.stopPropagation();mode==='create'?back():close();return}if(mode!=='picker')return;const buttons=[...$('rows').querySelectorAll('button')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(document.activeElement!==$('search')&&!buttons.includes(document.activeElement))return;e.preventDefault();const i=buttons.indexOf(document.activeElement);if(i===-1){buttons[e.key==='ArrowDown'?0:buttons.length-1]?.focus()}else{const next=i+(e.key==='ArrowDown'?1:-1);if(next<0||next>=buttons.length)$('search').focus();else buttons[next].focus()}}else if(e.key==='Enter'&&e.target===$('search')){e.preventDefault();buttons[0]?.click()}});
document.addEventListener('pointerdown',e=>{if(opened&&!$('component').contains(e.target))close()});
document.addEventListener('focusin',e=>{if(opened&&!$('component').contains(e.target))close(false)});
updateChips();
})();
</script>
</body>
</html>
