<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labels · Studio notes</title>
<style>
:root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242529;background:#fafaf9;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #5880b6;outline-offset:3px}button,input{-webkit-tap-highlight-color:transparent}button{color:inherit}header{height:82px;display:flex;align-items:center;gap:10px;padding:0 38px;color:#888984;font-size:12px;letter-spacing:.02em}.mark{display:grid;place-items:center;width:23px;height:23px;background:#30352e;color:#fafaf9;border-radius:7px;font-size:14px}.slash{color:#c8c9c4}main{width:min(360px,calc(100% - 48px));margin:94px auto 0}.eyebrow{font-size:10px;letter-spacing:.15em;font-weight:650;color:#8b8e85;margin:0 0 13px}h1{font-size:27px;letter-spacing:-1.05px;font-weight:550;line-height:1.2;margin:0 0 10px}.description{font-size:13px;line-height:1.6;color:#878982;margin:0 0 31px}.label-component{position:relative}.label-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:35px}.selected{display:contents}.chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;min-height:31px;padding:5px 10px;border:1px solid #e4e5e0;border-radius:20px;font-size:12px;background:#fff;box-shadow:0 1px 1px #22222205}.chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--color);flex-shrink:0}.trigger{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:20px;padding:7px 11px;background:#eeefeb;font-size:12px;min-height:33px;transition:background 120ms}.trigger:hover,.trigger[aria-expanded=true]{background:#e5e7e1}.plus{font-size:17px;line-height:14px;font-weight:400}.panel{margin-top:10px;width:100%;background:#fff;border:1px solid #dedfd9;border-radius:15px;box-shadow:0 3px 5px #33382906,0 12px 28px #3037270b;overflow:hidden;animation:appear 150ms cubic-bezier(.2,.7,.2,1)}[hidden]{display:none!important}.search-wrap{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid #f0f0ed;color:#979a92}.search-wrap svg{width:15px;height:15px;flex-shrink:0}.search{width:100%;border:0;background:none;color:#262925;font-size:13px;line-height:20px;min-width:0}.search::placeholder{color:#989b93}.search:focus-visible{outline-offset:5px;border-radius:2px}.rows{padding:6px;max-height:260px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}.row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;border-radius:8px;padding:11px 10px;font-size:13px;min-height:40px}.row:hover,.row:focus-visible{background:#f3f4f0}.row[aria-pressed=true]{background:#f6f7f3}.row+.row{margin-top:2px}.row-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.check{width:15px;height:15px;display:grid;place-items:center;border:1px solid #dcded6;border-radius:4px;color:transparent;font-size:11px;flex-shrink:0}.row[aria-pressed=true] .check{border-color:#373f32;background:#373f32;color:white}.create-offer{border-top:1px solid #edeee9;border-radius:0 0 8px 8px;margin-top:5px!important;color:#555c4c}.create-offer .plus{width:15px;text-align:center;flex-shrink:0}.foot{display:flex;justify-content:space-between;gap:8px;padding:11px 16px;background:#fcfcfa;border-top:1px solid #eeefe9;font-size:10px;color:#92968a}.escape{font-size:9px;border:1px solid #dddfd5;border-radius:4px;padding:1px 4px;margin-right:4px;color:#818778}.create-head{display:flex;gap:9px;align-items:center;padding:10px;background:#f6f7f3;border-bottom:1px solid #e9ebe3;font-size:12px;color:#747b6a}.back{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:7px;background:transparent;font-size:19px}.back:hover{background:#e9ece3}.create-head strong{font-weight:550;color:#394032}.draft-preview{margin-left:auto;max-width:165px;min-height:27px;padding:4px 8px;font-size:11px}.create-body{padding:17px 17px 15px}.field-label,legend{font-size:11px;color:#747b6b;font-weight:550;margin-bottom:8px}.field-label{display:block}.name-input{width:100%;border:1px solid #dfe3d7;border-radius:8px;padding:10px 11px;font-size:13px;background:#fff;color:#242923}fieldset{border:0;padding:0;margin:18px 0 0;min-width:0}legend{padding:0}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.color-option{position:relative;cursor:pointer}.color-option input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.color-option span{display:flex;align-items:center;gap:7px;border:1px solid #e8eae2;border-radius:7px;padding:9px 7px;font-size:11px;background:#fff;pointer-events:none}.color-option input:checked+span{border-color:#7d8870;background:#f2f5ec;box-shadow:0 0 0 1px #7d8870}.color-option input:focus-visible+span{outline:3px solid #5880b6;outline-offset:3px}.color-option i{width:8px;height:8px;border-radius:50%;background:var(--color);flex-shrink:0}.create-bottom{display:flex;align-items:center;gap:12px;margin-top:19px}.hint{font-size:10px;line-height:1.5;color:#8a907f;flex:1;margin:0}.submit{background:#3c4733;border:1px solid #3c4733;border-radius:8px;color:#fff;font-size:12px;padding:9px 18px;min-height:35px}.submit:hover{background:#2e3927}.submit:disabled{opacity:.4;cursor:not-allowed}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.page-note{font-size:10px;color:#afb2a6;margin-top:20px;letter-spacing:.01em}@keyframes appear{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}@media(max-width:500px){header{height:70px;padding:0 24px}main{margin-top:70px}h1{font-size:26px}.description{margin-bottom:26px}.rows{max-height:220px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><span class="mark" aria-hidden="true">↗</span><span>Studio notes</span><span class="slash">/</span><span>Projects</span></header>
<main><p class="eyebrow">A WORK IN PROGRESS</p><h1>Website refresh</h1><p class="description">Collect the ideas. Connect the details.</p>
<section class="label-component" id="component" aria-label="Project labels">
<div class="label-line"><div class="selected" id="selected"></div><button class="trigger" id="trigger" type="button" aria-expanded="false" aria-controls="panel" aria-haspopup="dialog"><span class="plus" aria-hidden="true">+</span>Labels</button></div>
<div class="panel" id="panel" role="dialog" aria-label="Labels" hidden>
<div id="picker"><div class="search-wrap"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.2"/><path d="m12 12 4.5 4.5"/></svg><input class="search" id="search" type="text" placeholder="Find or create a label…" aria-label="Search labels" autocomplete="off" maxlength="60"></div><div class="rows" id="rows" aria-label="Available labels"></div><div class="foot"><span id="count">Choose a label</span><span><span class="escape">esc</span>to close</span></div></div>
<form id="creation" hidden><div class="create-head"><button class="back" id="back" type="button" aria-label="Back">←</button><strong>Create label</strong><span class="chip draft-preview"><span class="dot" id="preview-dot"></span><span class="chip-name" id="preview-name"></span></span></div><div class="create-body"><label class="field-label" for="name">Label name</label><input class="name-input" id="name" maxlength="60" autocomplete="off" required><fieldset><legend>Choose a color</legend><div class="colors" id="colors"></div></fieldset><div class="create-bottom"><p class="hint" id="hint">Make it easy to spot.</p><button class="submit" id="submit" type="submit">Create</button></div></div></form>
</div></section><p class="page-note">A little organization goes a long way.</p><div class="sr" role="status" aria-live="polite" id="status"></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), component=$('component'),trigger=$('trigger'),panel=$('panel'),picker=$('picker'),creation=$('creation'),search=$('search'),rows=$('rows'),name=$('name');
const palette=[['Lilac','#8e66bd'],['Azure','#528ac3'],['Mint','#5a9b7f'],['Amber','#c79240'],['Rose','#c57192'],['Slate','#78848d']];
const labels=[{id:1,name:'Design',color:palette[0][1]},{id:2,name:'Research',color:palette[2][1]},{id:3,name:'Personal',color:palette[4][1]}];
const selected=new Set();let mode='closed',nextId=4,color=palette[0][1],draftQuery=null,draftName='';
const normalize=value=>value.trim().toLocaleLowerCase();
function makeDot(value){const dot=document.createElement('span');dot.className='dot';dot.style.setProperty('--color',value);dot.setAttribute('aria-hidden','true');return dot;}
function announce(message){$('status').textContent=message;}
function drawSelected(){const chips=labels.filter(label=>selected.has(label.id)).map(label=>{const chip=document.createElement('span');chip.className='chip';const text=document.createElement('span');text.className='chip-name';text.textContent=label.name;chip.title=label.name;chip.append(makeDot(label.color),text);return chip;});$('selected').replaceChildren(...chips);$('count').textContent=selected.size?`${selected.size} selected`:'Choose a label';}
function toggleLabel(label,button){if(selected.has(label.id))selected.delete(label.id);else selected.add(label.id);button.setAttribute('aria-pressed',String(selected.has(label.id)));drawSelected();announce(`${label.name} ${selected.has(label.id)?'selected':'removed'}`);}
function drawRows(){rows.replaceChildren();const query=normalize(search.value);labels.filter(label=>normalize(label.name).includes(query)).forEach(label=>{const button=document.createElement('button');button.type='button';button.className='row';button.setAttribute('aria-pressed',String(selected.has(label.id)));const check=document.createElement('span');check.className='check';check.textContent='✓';check.setAttribute('aria-hidden','true');const text=document.createElement('span');text.className='row-name';text.textContent=label.name;button.append(check,makeDot(label.color),text);button.addEventListener('click',()=>toggleLabel(label,button));rows.append(button);});if(query&&!labels.some(label=>normalize(label.name)===query)){const button=document.createElement('button');button.type='button';button.className='row create-offer';const plus=document.createElement('span');plus.className='plus';plus.textContent='+';plus.setAttribute('aria-hidden','true');const text=document.createElement('span');text.className='row-name';text.textContent=`Create “${search.value.trim()}”`;button.append(plus,text);button.addEventListener('click',beginCreate);rows.append(button);}}
function open(){mode='picker';creation.hidden=true;picker.hidden=false;panel.hidden=false;trigger.setAttribute('aria-expanded','true');drawRows();search.focus();}
function close(returnFocus=true){if(mode==='closed')return;mode='closed';panel.hidden=true;trigger.setAttribute('aria-expanded','false');if(returnFocus)trigger.focus();}
function updateDraft(){draftName=name.value;$('preview-name').textContent=draftName.trim()||'New label';$('preview-dot').style.setProperty('--color',color);$('submit').disabled=!draftName.trim();const duplicate=labels.some(label=>normalize(label.name)===normalize(draftName));$('hint').textContent=duplicate?'This label exists. Create will select it.':'Make it easy to spot.';}
function beginCreate(){if(mode!=='picker')return;if(draftQuery!==search.value){draftName=search.value.trim();color=palette[0][1];draftQuery=search.value;}name.value=draftName;for(const radio of $('colors').querySelectorAll('input'))radio.checked=radio.value===color;updateDraft();mode='create';picker.hidden=true;creation.hidden=false;name.focus();name.select();}
function back(){if(mode!=='create')return;mode='picker';creation.hidden=true;picker.hidden=false;search.focus();search.setSelectionRange(search.value.length,search.value.length);}
for(const [title,value] of palette){const label=document.createElement('label');label.className='color-option';const input=document.createElement('input');input.type='radio';input.name='color';input.value=value;input.setAttribute('aria-label',title);input.checked=value===color;const visual=document.createElement('span');const dot=document.createElement('i');dot.style.setProperty('--color',value);visual.append(dot,document.createTextNode(title));input.addEventListener('change',()=>{color=value;updateDraft();});label.append(input,visual);$('colors').append(label);}
trigger.addEventListener('click',()=>mode==='closed'?open():close());search.addEventListener('input',drawRows);name.addEventListener('input',updateDraft);$('back').addEventListener('click',back);
creation.addEventListener('submit',event=>{event.preventDefault();if(mode!=='create'||!name.value.trim())return;const value=name.value.trim();let label=labels.find(item=>normalize(item.name)===normalize(value));if(!label){label={id:nextId++,name:value,color};labels.push(label);}selected.add(label.id);search.value='';draftQuery=null;draftName='';mode='picker';creation.hidden=true;picker.hidden=false;drawSelected();drawRows();search.focus();announce(`${label.name} selected`);});
picker.addEventListener('keydown',event=>{const buttons=[...rows.querySelectorAll('button')];const index=buttons.indexOf(document.activeElement);if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const next=index<0?(event.key==='ArrowDown'?0:buttons.length-1):(index+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[next]?.focus();}else if(event.key==='Enter'&&event.target===search){event.preventDefault();buttons[0]?.click();}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&mode!=='closed'){event.preventDefault();event.stopPropagation();mode==='create'?back():close();}});
document.addEventListener('pointerdown',event=>{if(mode!=='closed'&&!component.contains(event.target))close();});
document.addEventListener('focusin',event=>{if(mode!=='closed'&&!component.contains(event.target))close(false);});
drawSelected();drawRows();
})();
</script>
</body></html>
